<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club Sign-up</title>
    <style>
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 100px 20PX 200px 20PX;
            font-family: Arial, sans-serif;
        }
        form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.1);
            padding-right: 20px;
        }
       input[type="text"],
        input[type="email"],
        input[type="tel"],
        select,
        input[type="search"] {
            width: 100%;
            padding: 10px;
            margin: 5px 10px 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .field {
            margin-left: 10px;
            margin-bottom: 15px;
            padding-right: 30px;
        }
        .radio-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>
<body>
<main>
<form>
    <h2>Sign Up for the Coding Club</h2>
    <p>Fill this out and we'll email you before the first meeting.</p>
<div class="field">
    <label for="search">Search Past events:</label>
    <input type="search" id="search" name="search">
</div>
<div class="field">
    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" required>
</div>
<div class="row">
    <div class="field">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
    </div>
</div>
<div class="field">
    <label for="MAJOR">Major:</label>
    <select id="major" name="major" required>
        <option value="">Select your major</option>
        <optgroup label="Engineering">
            <option value="electrical-engineering">Electrical Engineering</option>
            <option value="mechanical-engineering">Mechanical Engineering</option>
        </optgroup>
        <optgroup label="Computer Science">
            <option value="computer-science">Computer Science</option>
            <option value="software-engineering">Software Engineering</option>
        </optgroup>
    </select>
</div>
<div class="field">
    <label for="year">Membership  plan:</label>
    <div class="radio-group">
        <input type="radio" id="year1" name="year" value="1" required>
        <label for="year1">1 Year</label>
        <input type="radio" id="year2" name="year" value="2">
        <label for="year2">2 Years</label>
        
    

</form>

</main>
</body>
</html>
